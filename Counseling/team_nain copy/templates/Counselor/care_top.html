<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 文字コードをUTF-8に設定 -->
  <meta charset="UTF-8">

  <!-- スマートフォンなどの画面サイズに合わせて表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ページのタイトル -->
  <title>ようこそスクールカウンセラー</title>

  <!-- Bootstrap 5.3.0のCSSを読み込む -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- top.cssを読み込む -->
  <link rel="stylesheet" href="{{ url_for('static', filename='top.css') }}">
</head>

<body>

  <!-- ナビゲーションバー -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <!-- サイト名を表示 -->
      <span class="navbar-brand">🏫スクールカウンセラーシステム</span>

      <!-- ログアウト -->
      <form action="{{ url_for('logout') }}">
        <button type="submit" class="btn btn-primary">
          ログアウト
        </button>
      </form>
    </div>
  </nav>

           <!-- 画像を表示 -->
    <img src="{{ url_for('static', filename='カウンセラー1.png') }}" class="スクールカウンセラー">

   <h3>━━  メニュー  ━━</h3>
  
<!-- メニュー -->
<div class="menu-container">

    <!-- 面談日時 -->
    <a href="{{ url_for('care_reseva') }}" class="menu-card reservation">
        <div class="icon">📆</div>
        <h2>日時登録</h2>
        <p>
            生徒との面談日時を<br>
            登録することができます
        </p>
    </a>

    <!-- 面談履歴 -->
    <a href="{{ url_for('care_history') }}" class="menu-card2 reservation2">
        <div class="icon2">📄</div>
        <h2>面談履歴</h2>
        <p>
            これまでの面談相談履歴を<br>
            確認できます
        </p>
    </a>

    <!-- 予約確認 -->
    <a href="{{ url_for('care_schedule') }}" class="menu-card3 reservation3">
        <div class="icon3">📋</div>
        <h2>予約確認</h2>
        <p>
            予約情報を<br>
            確認できます
        </p>
    </a>
</div>

<!-- サイドバー -->
<div class="sidebar">
    <!-- サイドバーのタイトル -->

    <!-- ホーム -->

    </a>
    <!-- 日時登録 -->
    <a href="{{ url_for('care_reseva') }}" class="sidebar-item">
        📆
      <span>日時登録</span>
    </a>
    <!-- 面談履歴 -->
    <a href="{{ url_for('care_history') }}" class="sidebar-item">

    <a href="{{ url_for('care_schedule') }}" class="sidebar-item">
        📋
      <span>予約確認</span>
    </a>
