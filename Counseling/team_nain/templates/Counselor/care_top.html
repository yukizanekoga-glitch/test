
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スクールカウンセラー相談予約システム</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='care_common.css') }}">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='care_top.css') }}">
</head>

<body>

    {% set active_page = 'top' %}
    {% include 'components/care_header.html' %}

    <div class="layout">

        {% include 'components/care_sidebar.html' %}

        <!-- メインコンテンツ -->
        <main class="main-content">

            <!-- あいさつエリア -->
            <section class="hero">

                <img
                    src="{{ url_for('static', filename='aaaaaaaaaa.png') }}"
                    alt="カウンセリング室"
                    class="hero-image">

                <div class="hero-overlay"></div>

                <div class="hero-text">
                    <h1>こんにちは！</h1>

                    <p>
                        今日もカウンセリング業務お疲れさまです。<br>
                        メニューから面談の予定や予約状況を確認できます。
                    </p>
                </div>

            </section>

            <!-- メニュー -->
            <section class="menu-section">

                <h2 class="section-title">メニュー</h2>

                <div class="menu-container">

                    <!-- 面談可能日時登録 -->
                    <a href="{{ url_for('care_reseva_top') }}"
                       class="menu-card reservation">

                        <div class="card-icon">
                            <i class="bi bi-calendar3"></i>
                        </div>

                        <div class="menu-text">
                            <h3>面談可能日時登録</h3>
                            <p>
                                面談できる日時を登録して<br>
                                生徒からの予約を受け付けます
                            </p>
                        </div>

                        <i class="bi bi-chevron-right arrow"></i>
                    </a>

                    <!-- 面談日時変更 -->
                    <a href="{{ url_for('care_schedule') }}"
                       class="menu-card confirmation">

                        <div class="card-icon">
                            <i class="bi bi-calendar-check"></i>
                        </div>

                        <div class="menu-text">
                            <h3>面談予約確認</h3>
                            <p>
                                生徒の面談予約を確認することが<br>
                                できます
                            </p>
                        </div>

                        <i class="bi bi-chevron-right arrow"></i>
                    </a>

                    <!-- 面談履歴 -->
                    <a href="{{ url_for('care_history') }}"
                       class="menu-card history">

                        <div class="card-icon">
                            <i class="bi bi-clock-history"></i>
                        </div>

                        <div class="menu-text">
                            <h3>面談履歴</h3>
                            <p>
                                面談の履歴の確認と<br>
                                カルテの記入ができます
                            </p>
                        </div>

                        <i class="bi bi-chevron-right arrow"></i>
                    </a>

                </div>
            </section>

        </main>
    </div>



</body>
</html>
