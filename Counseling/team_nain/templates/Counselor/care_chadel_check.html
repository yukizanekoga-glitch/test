<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面談可能日時の変更（確認） | スクールカウンセラー相談予約システム</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='care_common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/care_chadel_check.css') }}">
</head>
<body>

    {% set active_page = 'reseva' %}
    {% include 'components/care_header.html' %}

    <div class="layout">

        {% include 'components/care_sidebar.html' %}

        <main class="main-content">
            <div class="page-heading"><span class="heading-line"></span><h1>面談可能日時の変更（確認）</h1></div>
            <p class="description">変更後の日付と時間帯をご確認ください。</p>
            {% set shown = after or before %}
            <section class="confirm-panel">
                <div class="confirm-inner">
                    <div class="confirm-row">
                        <div class="confirm-label">変更後の日付</div>
                        <div class="confirm-value">{{ shown.full_date }}</div>
                    </div>
                    <div class="confirm-row">
                        <div class="confirm-label">変更後の時間帯</div>
                        <div class="confirm-value time-list">
                            <div>{{ shown.time }}</div>
                        </div>
                    </div>
                </div>
            </section>
            <div class="button-area">
                <a href="{{ url_for('care_chadel') }}" class="btn-back">戻る</a>

                <!-- 「変更する」で変更内容を確定する -->
                <form method="post" action="{{ url_for('care_chadel_check') }}">
                    <button type="submit" class="btn-register">変更する</button>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
