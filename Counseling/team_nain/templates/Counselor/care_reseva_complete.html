<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 文字コードをUTF-8に設定 -->
  <meta charset="UTF-8">

  <!-- スマートフォンなどの画面サイズに合わせて表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ページのタイトル -->
  <title>日時登録完了 スクールカウンセラー</title>

  <!-- Bootstrap 5.3.0のCSSを読み込む -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <!-- サイト名を表示 -->
      <span class="navbar-brand">スクールカウンセラー 日時登録</span>
    </div>
  </nav>

  <!-- メインコンテンツ -->
  <div class="container mt-5">

    <!-- フォームを中央寄せにするための行 -->
    <div class="row justify-content-center">

      <!-- フォームの横幅を設定（中画面以上では4/12） -->
      <div class="col-md-4">

        <!-- ページの見出し -->
        <h2 class="text-center mb-4">登録しました</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-success" role="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <a href="{{ url_for('care_reseva') }}" class="btn btn-secondary">日時登録に戻る</a>
        <a href="{{ url_for('care_top') }}" class="btn btn-outline-secondary">トップへ</a>

      </div>
    </div>
  </div>

</body>
</html>
