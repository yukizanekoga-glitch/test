
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面談可能日時変更 | スクールカウンセラー相談予約システム</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/care_chadel.css') }}">

    <!-- アイコン -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- 日本語フォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>

    <!-- ヘッダー -->
    <header class="header">

        <div class="site-title">
            <i class="fa-solid fa-school"></i>
            <span>スクールカウンセラー相談予約システム</span>
        </div>

        <div class="user-info">
            <span>
                <i class="fa-regular fa-user"></i>
                {{ session.display_name }} 先生（スクールカウンセラー）
            </span>

            <span class="header-divider"></span>

            <a href="{{ url_for('logout')}}" class="logout">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                ログアウト
            </a>
        </div>

    </header>


    <!-- 全体レイアウト -->
    <div class="layout">

        <!-- サイドバー -->
        <aside class="sidebar">

            <a href="{{ url_for('care_top') }}" class="active">
                <i class="bi bi-house-door"></i>
                <span>ホーム</span>
            </a>

            <a href="{{ url_for('care_reseva_top') }}">
                <i class="bi bi-calendar3"></i>
                <span>面談可能日時登録</span>
            </a>

            <a href="{{ url_for('care_schedule') }}">
                <i class="bi bi-calendar-check"></i>
                <span>面談予約確認</span>
            </a>

            <a href="{{ url_for('care_history') }}">
                <i class="bi bi-clock-history"></i>
                <span>面談履歴</span>
            </a>

        </aside>


        <!-- メインコンテンツ -->
        <main class="main-content">

            <!-- ページタイトル -->
            <div class="page-heading">
                <span class="heading-line"></span>
                <h1>面談可能日時の変更</h1>
            </div>

            <p class="description">
                登録されている面談可能な日時を変更します。
            </p>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <p class="error-message" style="margin: 8px 0 0; color: #d93025; font-size: 14px;">{{ message }}</p>
                {% endfor %}
            {% endwith %}


            <!-- 日時設定パネル -->
            <section class="setting-panel">

                <h2 class="section-title">
                    変更する日時
                </h2>

                <form id="changeForm" method="post" action="{{ url_for('care_chadel') }}">

                    <!-- 変更する枠と操作の種類 -->
                    <input type="hidden" name="slot_id" value="{{ edit_slot.id if edit_slot else '' }}">
                    <input type="hidden" name="action" value="edit">

                    <!-- 日付 -->
                    <div class="setting-item date-item">

                        <label for="meetingDate" class="field-title">
                            日付
                        </label>

                        <div class="date-input-wrapper">
                            <i class="fa-regular fa-calendar-days"></i>

                            <input
                                type="date"
                                id="meetingDate"
                                name="date"
                                value="{{ edit_slot.date.isoformat() if edit_slot else '' }}"
                                required
                            >
                        </div>

                    </div>


                    <!-- 時間帯 -->
                    <div class="setting-item time-item">

                        <label class="field-title">
                            時間帯
                        </label>

                        <div class="time-range">

                            <select
                                id="startTime"
                                name="start_time"
                                aria-label="開始時刻"
                                required
                            >
                                <option value="09:00"{% if edit_slot and edit_slot.start_time.strftime('%H:%M') == '09:00' %} selected{% endif %}>09:00</option>
                                <option value="10:00"{% if edit_slot and edit_slot.start_time.strftime('%H:%M') == '10:00' %} selected{% endif %}>10:00</option>
                                <option value="10:30"{% if edit_slot and edit_slot.start_time.strftime('%H:%M') == '10:30' %} selected{% endif %}>10:30</option>
                                <option value="11:00"{% if edit_slot and edit_slot.start_time.strftime('%H:%M') == '11:00' %} selected{% endif %}>11:00</option>
                                <option value="11:30"{% if edit_slot and edit_slot.start_time.strftime('%H:%M') == '11:30' %} selected{% endif %}>11:30</option>
                                <option value="12:00"{% if edit_slot and edit_slot.start_time.strftime('%H:%M') == '12:00' %} selected{% endif %}>12:00</option>
                                <option value="13:00"{% if edit_slot and edit_slot.start_time.strftime('%H:%M') == '13:00' %} selected{% endif %}>13:00</option>
                                <option value="13:30"{% if edit_slot and edit_slot.start_time.strftime('%H:%M') == '13:30' %} selected{% endif %}>13:30</option>
                                <option value="14:00"{% if edit_slot and edit_slot.start_time.strftime('%H:%M') == '14:00' %} selected{% endif %}>14:00</option>
                                <option value="14:30"{% if edit_slot and edit_slot.start_time.strftime('%H:%M') == '14:30' %} selected{% endif %}>14:30</option>
                                <option value="15:00"{% if edit_slot and edit_slot.start_time.strftime('%H:%M') == '15:00' %} selected{% endif %}>15:00</option>
                                <option value="15:30"{% if edit_slot and edit_slot.start_time.strftime('%H:%M') == '15:30' %} selected{% endif %}>15:30</option>
                                <option value="16:00"{% if edit_slot and edit_slot.start_time.strftime('%H:%M') == '16:00' %} selected{% endif %}>16:00</option>
                                <option value="16:30"{% if edit_slot and edit_slot.start_time.strftime('%H:%M') == '16:30' %} selected{% endif %}>16:30</option>
                                <option value="17:00"{% if edit_slot and edit_slot.start_time.strftime('%H:%M') == '17:00' %} selected{% endif %}>17:00</option>
                            </select>

                            <span class="time-separator">〜</span>

                            <select
                                id="endTime"
                                name="end_time"
                                aria-label="終了時刻"
                                required
                            >
                                <option value="09:30"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '09:30' %} selected{% endif %}>09:30</option>
                                <option value="10:00"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '10:00' %} selected{% endif %}>10:00</option>
                                <option value="10:30"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '10:30' %} selected{% endif %}>10:30</option>
                                <option value="11:00"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '11:00' %} selected{% endif %}>11:00</option>
                                <option value="11:30"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '11:30' %} selected{% endif %}>11:30</option>
                                <option value="12:00"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '12:00' %} selected{% endif %}>12:00</option>
                                <option value="12:30"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '12:30' %} selected{% endif %}>12:30</option>
                                <option value="13:00"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '13:00' %} selected{% endif %}>13:00</option>
                                <option value="13:30"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '13:30' %} selected{% endif %}>13:30</option>
                                <option value="14:00"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '14:00' %} selected{% endif %}>14:00</option>
                                <option value="14:30"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '14:30' %} selected{% endif %}>14:30</option>
                                <option value="15:00"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '15:00' %} selected{% endif %}>15:00</option>
                                <option value="15:30"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '15:30' %} selected{% endif %}>15:30</option>
                                <option value="16:00"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '16:00' %} selected{% endif %}>16:00</option>
                                <option value="16:30"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '16:30' %} selected{% endif %}>16:30</option>
                                <option value="17:00"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '17:00' %} selected{% endif %}>17:00</option>
                                <option value="17:30"{% if edit_slot and edit_slot.end_time.strftime('%H:%M') == '17:30' %} selected{% endif %}>17:30</option>
                            </select>

                        </div>

                    </div>

                </form>

            </section>


            <!-- 操作ボタン -->
            <section class="confirm-panel">

                <div class="button-group">

                        <a href="{{ url_for('care_reseva_top') }}" class="btn-cancel">
                    キャンセル</a>
                        <button type="submit" form="changeForm" class="btn-register">
                    変更する</button>

                </div>

            </section>

        </main>

    </div>
</body>
</html>
