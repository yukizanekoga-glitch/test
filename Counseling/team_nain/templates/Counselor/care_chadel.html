
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面談可能日時変更 | スクールカウンセラー相談予約システム</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/care_chadel.css') }}">

    <!-- アイコン -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- 日本語フォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>

    <!-- ヘッダー -->
    <header class="header">

        <div class="site-title">
            <i class="fa-solid fa-school"></i>
            <span>スクールカウンセラー相談予約システム</span>
        </div>

        <div class="user-info">
            <span>
                <i class="fa-regular fa-user"></i>
                {{ session.display_name }} 先生（スクールカウンセラー）
            </span>

            <span class="header-divider"></span>

            <a href="{{ url_for('logout')}}" class="logout">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                ログアウト
            </a>
        </div>

    </header>


    <!-- 全体レイアウト -->
    <div class="layout">

        <!-- サイドバー -->
        <aside class="sidebar">

            <a href="{{ url_for('care_top')}}">
                <i class="fa-solid fa-house"></i>
                <span>ホーム</span>
            </a>

            <a href="{{ url_for('care_chadel')}}" class="active">
                <i class="fa-regular fa-calendar-days"></i>
                <span>面談日時変更</span>
            </a>

            <a href="{{ url_for('care_reseva_top')}}">
                <i class="fa-regular fa-calendar-check"></i>
                <span>面談可能日時</span>
            </a>

            <a href="{{ url_for('care_history')}}">
                <i class="fa-regular fa-clock"></i>
                <span>面談履歴</span>
            </a>

        </aside>


        <!-- メインコンテンツ -->
        <main class="main-content">

            <!-- ページタイトル -->
            <div class="page-heading">
                <span class="heading-line"></span>
                <h1>面談可能日時の変更</h1>
            </div>

            <p class="description">
                登録されている面談可能な日時を変更します。
            </p>


            <!-- 日時設定パネル -->
            <section class="setting-panel">

                <h2 class="section-title">
                    変更する日時
                </h2>

                <form id="changeForm">

                    <!-- 日付 -->
                    <div class="setting-item date-item">

                        <label for="meetingDate" class="field-title">
                            日付
                        </label>

                        <div class="date-input-wrapper">
                            <i class="fa-regular fa-calendar-days"></i>

                            <input
                                type="date"
                                id="meetingDate"
                                name="meetingDate"
                                value="2026-10-20"
                                required
                            >
                        </div>

                    </div>


                    <!-- 時間帯 -->
                    <div class="setting-item time-item">

                        <label class="field-title">
                            時間帯
                        </label>

                        <div class="time-range">

                            <select
                                id="startTime"
                                name="startTime"
                                aria-label="開始時刻"
                                required
                            >
                                <option value="09:00">09:00</option>
                                <option selected value="10:00">10:00</option>
                                <option value="10:30">10:30</option>
                                <option value="11:00">11:00</option>
                                <option value="11:30">11:30</option>
                                <option value="12:00">12:00</option>
                                <option value="13:00">13:00</option>
                                <option value="13:30">13:30</option>
                                <option value="14:00">14:00</option>
                                <option value="14:30">14:30</option>
                                <option value="15:00">15:00</option>
                                <option value="15:30">15:30</option>
                                <option value="16:00">16:00</option>
                                <option value="16:30">16:30</option>
                                <option value="17:00">17:00</option>
                            </select>

                            <span class="time-separator">〜</span>

                            <select
                                id="endTime"
                                name="endTime"
                                aria-label="終了時刻"
                                required
                            >
                                <option value="09:30">09:30</option>
                                <option value="10:00">10:00</option>
                                <option selected value="10:30">10:30</option>
                                <option value="11:00">11:00</option>
                                <option value="11:30">11:30</option>
                                <option value="12:00">12:00</option>
                                <option value="12:30">12:30</option>
                                <option value="13:00">13:00</option>
                                <option value="13:30">13:30</option>
                                <option value="14:00">14:00</option>
                                <option value="14:30">14:30</option>
                                <option value="15:00">15:00</option>
                                <option value="15:30">15:30</option>
                                <option value="16:00">16:00</option>
                                <option value="16:30">16:30</option>
                                <option value="17:00">17:00</option>
                                <option value="17:30">17:30</option>
                            </select>

                        </div>

                    </div>

                </form>

            </section>


            <!-- 操作ボタン -->
            <section class="confirm-panel">

                <div class="button-group">

                        <a href="{{ url_for('care_reseva_top') }}" class="btn-cancel">
                    キャンセル</a>
                        <a href="{{ url_for('care_chadel_check') }}" class="btn-register">
                    変更する</a>

                </div>

            </section>

        </main>

    </div>
</body>
</html>
