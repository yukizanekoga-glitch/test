<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 文字コードをUTF-8に設定 -->
  <meta charset="UTF-8">

  <!-- スマートフォンなどの画面サイズに合わせて表示する -->

  <!-- ページのタイトル -->
  <title>ようこそスクールカウンセラー</title>

  <!-- Bootstrap 5.3.0のCSSを読み込む -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- top.cssを読み込む -->
  <link rel="stylesheet" href="{{ url_for('static', filename='top.css') }}">

<body>

  <!-- ナビゲーションバー -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <!-- サイト名を表示 -->
      <span class="navbar-brand">🏫スクールカウンセラーシステム</span>

      <!-- ログアウト -->
      <form action="{{ url_for('logout') }}">
        <button type="submit" class="btn btn-primary">
          ログアウト
        </button>
      </form>
    </div>
  </nav>

           <!-- 画像を表示 -->
  <img src="{{ url_for('static', filename='職員用.png') }}" class="スクールカウンセラー">
  
  <h3>━━  メニュー  ━━</h3>
  
<!-- メニュー -->
<div class="menu-container2">

    <!-- 生徒一覧画面 -->
    <a href="{{ url_for('manage_student') }}" class="menu-card4 reservation4">
        <div class="icon4">👫</div>
        <h2>生徒一覧画面</h2>
        <p>
            生徒の情報を一覧として<br>
            標示されています
        </p>
    </a>

    <!-- カウンセラー画面-->

        <p>
            カウンセラーの情報を編集や削除を<br>

</div>

    <h2>メニュー</h2>

    <a href="{{ url_for('management_top') }}" class="sidebar-item">
        🏠
      <span>ホーム</span>
    </a>
    <!-- 生徒一覧画面 -->
    <a href="{{ url_for('manage_student') }}" class="sidebar-item">
        👫
      <span>生徒一覧画面</span>
    </a>

    <a href="{{ url_for('manage_care') }}" class="sidebar-item">
        👦
      <span>カウンセラー一覧画面</span>
    </a>
