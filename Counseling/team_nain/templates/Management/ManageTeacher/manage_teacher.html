<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 文字コードをUTF-8に設定 -->
  <meta charset="UTF-8">

  <!-- スマートフォンなどの画面サイズに合わせて表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ページのタイトル -->
  <title>先生一覧 管理者</title>

  <!-- Bootstrap 5.3.0のCSSを読み込む -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <!-- ナビゲーションバー -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <!-- サイト名を表示 -->
      <span class="navbar-brand">スクールカウンセラー 先生一覧</span>
    </div>
  </nav>

  <!-- メインコンテンツ -->
  <div class="container mt-5">

    <!-- ページの見出し -->
    <h2 class="text-center mb-4">先生一覧</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- 先生一覧 -->
    <div class="row justify-content-center">

      {% for teacher in teachers %}
      <div class="col-md-6 mb-3">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">{{ teacher.display_name }}</h5>
            <a href="{{ url_for('manage_teapass', teacher_id=teacher.id) }}" class="btn btn-primary">
              パスワード変更
            </a>
            <a href="{{ url_for('manage_teadel_check', teacher_id=teacher.id) }}" class="btn btn-primary">
              削除
            </a>
          </div>
        </div>
      </div>
      {% else %}
      <p class="text-center text-muted">先生が登録されていません。</p>
      {% endfor %}

    </div>

     
    <!-- 戻るボタン -->
    <div class="text-center mt-4">
      <a href="{{ url_for('management_top') }}" class="btn btn-secondary">
        戻る
      </a>

     <a href="{{ url_for('manage_tearec') }}" class="btn btn-primary">新規登録</a>
    </div>

  </div>

</body>
</html>
