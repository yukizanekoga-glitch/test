<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 文字コードをUTF-8に設定 -->
  <meta charset="UTF-8">

  <!-- スマートフォンなどの画面サイズに合わせて表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ページのタイトル -->
  <title>先生登録 管理者</title>

  <!-- Bootstrap 5.3.0のCSSを読み込む -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <!-- サイト名を表示 -->
      <span class="navbar-brand">スクールカウンセラー 先生登録</span>
    </div>
  </nav>

  <!-- メインコンテンツ -->
  <div class="container mt-5">

    <!-- フォームを中央寄せにするための行 -->
    <div class="row justify-content-center">

      <!-- フォームの横幅を設定（中画面以上では4/12） -->
      <div class="col-md-4">

        <!-- ページの見出し -->
        <h2 class="text-center mb-4">先生</h2>
        <h3 class="text-center mb-4">先生登録</h3>
        <h3 class="text-center mb-4">先生情報入力</h3>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="post" action="{{ url_for('manage_tearec') }}">
          <div class="mb-3">
            <label for="display_name" class="form-label">先生名</label>
            <input type="text" id="display_name" name="display_name" class="form-control" placeholder="例: 山田 太郎">
          </div>

          <!-- 戻るボタン -->
          <a href="{{ url_for('manage_teacher') }}" class="btn btn-secondary">戻る</a>
          <!-- 確認ボタン -->
          <button type="submit" class="btn btn-primary">次へ</button>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
