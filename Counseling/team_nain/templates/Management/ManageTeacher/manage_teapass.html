
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理者 先生パスワード変更</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">先生パスワード変更</span>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">パスワード変更</h2>
        <p class="text-muted">{{ teacher.display_name }} さんのパスワードを変更します。</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="post" action="{{ url_for('manage_teapass') }}">
            <input type="hidden" name="teacher_id" value="{{ teacher.id }}">

            <div class="mb-3">
                <label for="new_password" class="form-label">新しいパスワード</label>
                <input type="password"
                       id="new_password"
                       name="new_password"
                       class="form-control"
                       placeholder="半角英数字8文字以上">
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label">新しいパスワード（確認）</label>
                <input type="password"
                       id="confirm_password"
                       name="confirm_password"
                       class="form-control"
                       placeholder="確認のためもう一度入力">
            </div>

            <button type="submit" class="btn btn-primary">変更</button>
            <a href="{{ url_for('manage_teacher') }}" class="btn btn-secondary ms-2">戻る</a>
        </form>
    </div>
</body>
</html>
