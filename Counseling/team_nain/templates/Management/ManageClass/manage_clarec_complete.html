
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>クラスの新規登録（完了） | スクールカウンセラー相談予約システム</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/manage_clarec_complete.css') }}">
</head>

<body>

    <!-- ヘッダー -->
    <header class="top-header">

        <div class="system-title">
            スクールカウンセラー相談予約システム
        </div>

        <div class="header-right">

            <span class="admin-name">
                <i class="bi bi-person-fill"></i>
                {{ session.display_name }}（管理者）
                <i class="bi bi-chevron-down"></i>
            </span>

            <span class="header-divider"></span>

            <a href="{{ url_for('logout') }}" class="logout">
                <i class="bi bi-box-arrow-right"></i>
                ログアウト
            </a>

        </div>
    </header>

    <div class="layout">

        <!-- サイドバー -->
        <aside class="sidebar">

            <a href="/management_top">
                <span><i class="bi bi-house-door"></i></span>
                ホーム
            </a>

            <a href="/manage_student">
                <span><i class="bi bi-people"></i></span>
                生徒管理
            </a>

            <a href="/manage_teacher">
                <span><i class="bi bi-person-badge"></i></span>
                先生管理
            </a>

            <a href="/manage_care">
                <span><i class="bi bi-calendar3"></i></span>
                カウンセラー管理
            </a>

            <a href="{{ url_for('manage_class') }}" class="active">
                <span><i class="bi bi-file-earmark-text"></i></span>
                クラス管理
            </a>

            <a href="/manage_survey">
                <span><i class="bi bi-bar-chart-line"></i></span>
                アンケート結果
            </a>

        </aside>

        <!-- メイン -->
        <main class="main-content">

            <!-- パンくず -->
            <div class="breadcrumb">
                <a href="/manage_top">ホーム</a>
                <i class="bi bi-chevron-right"></i>

                <a href="{{ url_for('manage_class') }}">クラス管理</a>
                <i class="bi bi-chevron-right"></i>

                <span>クラスの新規登録</span>
                <i class="bi bi-chevron-right"></i>

                <span>完了</span>
            </div>

            <!-- ページタイトル -->
            <div class="page-heading">
                <h1>クラスの新規登録（完了）</h1>
                <p>クラスの登録が完了しました。</p>
            </div>

            <!-- 完了カード -->
            <section class="complete-card">

                <!-- チェックマーク -->
                <div class="complete-icon">
                    <i class="bi bi-check-lg"></i>
                </div>

                <!-- 完了メッセージ -->
                <h2 class="complete-title">
                    クラスの登録が完了しました。
                </h2>

                <p class="complete-message">
                    以下の内容でクラスに生徒を割り当てました。
                </p>

                <!-- 登録内容 -->
                <div class="result-box">

                    <table class="result-table">
                        <tbody>
                            <tr>
                                <th>学年</th>
                                <td>1年</td>
                            </tr>

                            <tr>
                                <th>クラス</th>
                                <td>1組</td>
                            </tr>

                            <tr>
                                <th>担任の先生</th>
                                <td>山田 花子</td>
                            </tr>

                            <tr>
                                <th>割り当てた生徒数</th>
                                <td>30名</td>
                            </tr>
                        </tbody>
                    </table>

                </div>

                <!-- ボタン -->
                <div class="complete-actions">

                    <a href="{{ url_for('manage_class') }}" class="back-btn">
                        
                        クラス管理に戻る
                    </a>

                </div>

            </section>

        </main>

    </div>

    <!-- ログアウトの確認ポップアップ (全画面共通) -->
    <script src="{{ url_for('static', filename='Js/logout_confirm.js') }}"></script>
</body>
</html>
