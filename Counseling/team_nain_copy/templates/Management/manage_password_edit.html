<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 文字コードをUTF-8に設定 -->
  <meta charset="UTF-8">

  <!-- スマートフォンなどの画面サイズに合わせて表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ページのタイトル -->
  <title>パスワード変更 管理者</title>

  <!-- Bootstrap 5.3.0のCSSを読み込む -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <!-- ナビゲーションバー -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <!-- サイト名を表示 -->
      <span class="navbar-brand">スクールカウンセラー パスワード変更</span>
    </div>
  </nav>

  <!-- メインコンテンツ -->
  <div class="container mt-5">

    <!-- エラーメッセージ表示 -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-danger" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="row justify-content-center">
      <div class="col-md-4">

        <!-- ページの見出し -->
        <h2 class="text-center mb-4">パスワード変更</h2>

        <table class="table table-bordered">
          <tbody>
            <tr>
              <th>区分</th>
              <td>{{ role_label }}</td>
            </tr>
            <tr>
              <th>氏名</th>
              <td>{{ target_user.display_name }}</td>
            </tr>
            <tr>
              <th>ユーザー名</th>
              <td>{{ target_user.username }}</td>
            </tr>
          </tbody>
        </table>

        <!-- パスワード変更フォーム -->
        <form method="post" action="{{ url_for('manage_password_edit', user_id=target_user.id) }}">

          <div class="mb-3">
            <label for="new_password" class="form-label">新しいパスワード</label>
            <input type="password" class="form-control" id="new_password" name="new_password" required minlength="6">
          </div>

          <div class="mb-3">
            <label for="confirm_password" class="form-label">新しいパスワード（確認）</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6">
          </div>

          <div class="d-flex gap-2">
            <a href="{{ url_for('manage_password') }}" class="btn btn-secondary">戻る</a>
            <button type="submit" class="btn btn-primary">次へ</button>
          </div>

        </form>

      </div>
    </div>
  </div>

</body>
</html>
