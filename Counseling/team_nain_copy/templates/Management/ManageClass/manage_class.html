
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>クラス一覧</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">クラス一覧</span>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">クラス一覧</h2>

            <button type="button" class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#classRegisterModal">
                + クラス登録
            </button>
        </div>

        <table class="table table-bordered text-center align-middle">
            <thead class="table-light">
                <tr>
                    <th>クラス</th>
                    <th>操作</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>1年1組</td>
                    <td>
                        <a href="{{ url_for('manage_stuallo') }}"
                           class="btn btn-primary">生徒割り当て</a>
                        <a href="{{ url_for('manage_teallo') }}"
                           class="btn btn-primary">先生割り当て</a>
                    </td>
                </tr>

                <tr>
                    <td>1年2組</td>
                    <td>
                        <a href="{{ url_for('manage_stuallo') }}"
                           class="btn btn-primary">生徒割り当て</a>
                        <a href="{{ url_for('manage_teallo') }}"
                           class="btn btn-primary">先生割り当て</a>
                    </td>
                </tr>

                <tr>
                    <td>2年1組</td>
                    <td>
                        <a href="{{ url_for('manage_stuallo') }}"
                           class="btn btn-primary">生徒割り当て</a>
                        <a href="{{ url_for('manage_teallo') }}"
                           class="btn btn-primary">先生割り当て</a>
                    </td>
                </tr>

                <tr>
                    <td>2年2組</td>
                    <td>
                        <a href="{{ url_for('manage_stuallo') }}"
                           class="btn btn-primary">生徒割り当て</a>
                        <a href="{{ url_for('manage_teallo') }}"
                           class="btn btn-primary">先生割り当て</a>
                    </td>
                </tr>

                <tr>
                    <td>3年1組</td>
                    <td>
                        <a href="{{ url_for('manage_stuallo') }}"
                           class="btn btn-primary">生徒割り当て</a>
                        <a href="{{ url_for('manage_teallo') }}"
                           class="btn btn-primary">先生割り当て</a>
                    </td>
                </tr>

                <tr>
                    <td>3年2組</td>
                    <td>
                        <a href="{{ url_for('manage_stuallo') }}"
                           class="btn btn-primary">生徒割り当て</a>
                        <a href="{{ url_for('manage_teallo') }}"
                           class="btn btn-primary">先生割り当て</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <a href="{{ url_for('management_top') }}"
           class="btn btn-secondary mt-3">戻る</a>
    </div>

    <!-- クラス登録モーダル -->
    <div class="modal fade" id="classRegisterModal"
         tabindex="-1" aria-labelledby="classRegisterModalLabel"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="classRegisterModalLabel">
                        クラス登録
                    </h5>

                    <button type="button" class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="閉じる"></button>
                </div>

                <div class="modal-body">
                    <p class="text-secondary">
                        登録するクラスの情報を入力してください。
                    </p>

                    <div class="mb-3">
                        <label for="grade" class="form-label">学年</label>
                        <select id="grade" class="form-select">
                            <option value="1">1年</option>
                            <option value="2">2年</option>
                            <option value="3">3年</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="classNumber" class="form-label">組</label>
                        <select id="classNumber" class="form-select">
                            <option value="1">1組</option>
                            <option value="2">2組</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        キャンセル
                    </button>

                    <a href="{{ url_for('manage_teallo') }}"
                       class="btn btn-primary">
                        登録
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
