<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 文字コードをUTF-8に設定 -->
  <meta charset="UTF-8">

  <!-- スマートフォンなどの画面サイズに合わせて表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ページのタイトル -->
  <title>パスワード変更完了 管理者</title>

  <!-- Bootstrap 5.3.0のCSSを読み込む -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <!-- ナビゲーションバー -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <!-- サイト名を表示 -->
      <span class="navbar-brand">スクールカウンセラー パスワード変更</span>
    </div>
  </nav>

  <!-- メインコンテンツ -->
  <div class="container mt-5">

    <div class="row justify-content-center">
      <div class="col-md-4">

        <!-- ページの見出し -->
        <h2 class="text-center mb-4">変更しました</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-success" role="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="d-flex gap-2">
          <a href="{{ url_for('manage_password') }}" class="btn btn-secondary">一覧に戻る</a>
          <a href="{{ url_for('management_top') }}" class="btn btn-outline-secondary">トップへ</a>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
