
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>日時登録完了 スクールカウンセラー</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome アイコン -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- 日本語フォント -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/care_reseva_complete.css') }}">
</head>

<body>

    <!-- ヘッダー -->
    <header class="header">
        <div class="site-title">
            スクールカウンセラー相談予約システム
        </div>

        <div class="user-info">
            <span>
                <i class="fa-regular fa-user"></i>
                スクールカウンセラー
            </span>

            <span class="header-divider"></span>

            <a href="{{ url_for('logout') }}" class="logout">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                ログアウト
            </a>
        </div>
    </header>

    <!-- 全体レイアウト -->
    <div class="layout">

        <!-- サイドバー -->
        <aside class="sidebar">

            <a href="{{ url_for('care_top') }}">
                <i class="fa-solid fa-house"></i>
                <span>ホーム</span>
            </a>

            <a href="{{ url_for('care_reseva') }}" class="active">
                <i class="fa-regular fa-calendar-days"></i>
                <span>面談可能日時登録</span>
            </a>

            <a href="{{ url_for('care_reseva_check')}}">
                <i class="fa-regular fa-calendar-check"></i>
                <span>面談予約確認</span>
            </a>

            <a href="#">
                <i class="fa-regular fa-clock"></i>
                <span>面談履歴</span>
            </a>

        </aside>

        <!-- メインコンテンツ -->
        <main class="main-content">

            <!-- パンくずリスト -->
            <div class="breadcrumb">
                <a href="{{ url_for('care_top') }}">ホーム</a>
                <span>›</span>
                <span>日時登録</span>
                <span>›</span>
                <span>完了</span>
            </div>

            <!-- 見出し -->
            <div class="page-heading">
                <span class="heading-line"></span>
                <h1>日時登録（完了）</h1>
            </div>

            <!-- 完了カード -->
            <section class="success-panel">

                <div class="success-icon">
                    <i class="fa-solid fa-check"></i>
                </div>

                <p class="success-message">
                    登録しました
                </p>

                <div class="success-button-area">
                    <a href="{{ url_for('care_reseva_top') }}"
                       class="btn-back-list">
                        一覧に戻る
                    </a>
                </div>

            </section>

        </main>
    </div>

</body>
</html>
