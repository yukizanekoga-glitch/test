<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面談可能日時の登録（確認）</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- アイコン -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- 外部CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/care_reseva_confirm.css') }}">
</head>

<body>

    <!-- ヘッダー -->
    <header class="header">
        <div class="site-title">
            スクールカウンセラー相談予約システム
        </div>

        <div class="user-info">
            <i class="bi bi-person"></i>
            スクールカウンセラー
            <span class="header-divider"></span>
            <a href="{{ url_for('login') }}" class="logout">
                <i class="bi bi-box-arrow-right"></i>
                ログアウト
            </a>
        </div>
    </header>

    <div class="layout">

        <!-- 左側メニュー -->
        <aside class="sidebar">
            <a href="{{ url_for('care_top') }}">
                <i class="bi bi-house-door"></i>
                <span>ホーム</span>
            </a>

            <a href="care_reseva" class="active">
                <i class="bi bi-calendar3"></i>
                <span>面談可能日時登録</span>
            </a>

            <a href="care_chadel">
                <i class="bi bi-calendar-check"></i>
                <span>面談日時変更
                </span>
            </a>

            <a href="{{ url_for('care_reseva') }}">
                <i class="bi bi-clock-history"></i>
                <span>面談履歴</span>
            </a>
        </aside>

        <!-- メインコンテンツ -->
        <main class="main-content">

            <!-- パンくずリスト -->
            <div class="breadcrumb">
                ホーム <span>›</span>
                面談可能日時登録 <span>›</span>
                確認
            </div>

            <!-- ページ見出し -->
            <div class="page-heading">
                <span class="heading-line"></span>
                <h1>面談可能日時の登録（確認）</h1>
            </div>

            <p class="description">
                以下の内容で登録します。よろしいですか？
            </p>

            <!-- 登録内容 -->
            <section class="confirm-panel">
                <div class="confirm-inner">

                    <div class="confirm-row">
                        <div class="confirm-label">日付</div>
                        <div class="confirm-value">
                            2026年10月20日（火）
                        </div>
                    </div>

                    <div class="confirm-row">
                        <div class="confirm-label">時間帯</div>
                        <div class="confirm-value time-list">
                            <div>09:00 ～ 09:30</div>
                            <div>10:00 ～ 10:30</div>
                            <div>13:00 ～ 13:30</div>
                            <div>14:00 ～ 14:30</div>
                            <div>15:00 ～ 15:30</div>
                        </div>
                    </div>

                </div>
            </section>

            <!-- ボタン -->
            <div class="button-area">

                <a href="{{ url_for('care_reseva_complete') }}"
                   class="btn btn-register">
                    登録する
                </a>

                <a href="{{ url_for('care_reseva') }}"
                   class="btn btn-back">
                    戻る
                </a>

            </div>

        </main>
    </div>

</body>
</html>
